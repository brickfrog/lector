[package]
name = "lector"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4", features = ["derive", "wrap_help"] }
epub = "2.1.6"
ort = "=2.0.0-rc.15"
scraper = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
percent-encoding = "2"

[[bin]]
name = "lector"
path = "src/main.rs"
